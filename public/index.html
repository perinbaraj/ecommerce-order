<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Orders Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛍️ E-Commerce Orders Dashboard</h1>
            <div class="stats-container" id="statsContainer">
                <div class="stat-card">
                    <div class="stat-label">Total Orders</div>
                    <div class="stat-value" id="totalOrders">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Revenue</div>
                    <div class="stat-value" id="totalRevenue">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Avg Order Value</div>
                    <div class="stat-value" id="avgOrderValue">-</div>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by order ID or customer name..."
                >
            </div>
            
            <div class="filters">
                <select id="statusFilter">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="processing">Processing</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                
                <select id="stateFilter">
                    <option value="">All States</option>
                </select>
                
                <button id="clearFilters">Clear Filters</button>
            </div>
        </div>

        <div class="orders-container">
            <div id="loadingIndicator" class="loading">Loading orders...</div>
            <div id="ordersGrid" class="orders-grid"></div>
            <div id="errorMessage" class="error-message"></div>
        </div>

        <div class="pagination" id="pagination">
            <button id="prevPage" disabled>← Previous</button>
            <span id="pageInfo">Page 1 of 1</span>
            <button id="nextPage" disabled>Next →</button>
        </div>

        <div id="orderModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="orderDetails"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
